name: Refresh dependency lockfile

on:
  push:
    branches:
      - maintenance/sync-dependency-lockfile-20261015

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update lockfile without changing dependency ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync lockfile with declared dependencies"
            git push origin HEAD:refs/heads/maintenance/sync-dependency-lockfile-20261015
          fi
