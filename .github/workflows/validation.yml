name: Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing lockfile predates the @vercel/oidc dependency; npm install repairs it in CI.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
